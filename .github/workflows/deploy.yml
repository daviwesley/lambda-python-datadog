name: Deploy

on:
  push:
    branches:
      - develop
      - "release/**"
      - "hotfix/**"
    paths-ignore:
      # Documentation files
      - "docs/**"
      - "**/*.md"
      - "README.md"
      - "LICENSE"
      # GitHub workflows and configurations
      - ".github/**"
      - ".gitignore"
      # Configuration files (not needed for deploy)
      - ".editorconfig"
      - ".pre-commit-config.yaml"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod
  release:
    types:
      - published

# One deployment at a time — cancel any in-progress run for the same ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}

jobs:
  # ---------------------------------------------------------------------------
  # Deploy to dev — triggered on every push to develop
  # ---------------------------------------------------------------------------
  deploy-dev:
    if: |
      github.actor == github.repository_owner && (
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
      )
    name: Deploy → dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx (for ARM64 support)
        uses: docker/setup-buildx-action@v3


      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node.js dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to dev
        run: make deploy STAGE=dev REGION=${{ env.AWS_REGION }}
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ env.DD_SITE }}
          APP_VERSION: ${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Create prerelease tags for GitFlow release/hotfix branches
  # ---------------------------------------------------------------------------
  create-prerelease:
    if: |
      github.actor == github.repository_owner &&
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/heads/hotfix/')
      )
    name: Create prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitFlow prerelease
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const branchName = context.ref.replace('refs/heads/', '');
            const branchMatch = branchName.match(
              /^(release|hotfix)[\/-](?:v)?(\d+\.\d+\.\d+)(?:[\/-].*)?$/i
            );

            if (!branchMatch) {
              core.setFailed(
                `Branch ${branchName} must follow release/<semver> or hotfix/<semver> to create a GitFlow prerelease.`
              );
              return;
            }

            const branchType = branchMatch[1].toLowerCase();
            const version = branchMatch[2];
            const tagPrefix = `v${version}-rc.`;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const branchReleases = releases
              .filter((release) => release.tag_name.startsWith(tagPrefix))
              .sort((left, right) => {
                const leftRc = Number(left.tag_name.slice(tagPrefix.length));
                const rightRc = Number(right.tag_name.slice(tagPrefix.length));
                return rightRc - leftRc;
              });

            const existingRelease = branchReleases.find((release) => release.target_commitish === sha);
            if (existingRelease) {
              core.info(`Release ${existingRelease.tag_name} already exists for ${sha}; skipping.`);
              return;
            }

            const nextRc = branchReleases.length > 0
              ? Number(branchReleases[0].tag_name.slice(tagPrefix.length)) + 1
              : 1;

            const tagName = `${tagPrefix}${nextRc}`;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });

              core.info(`Release ${tagName} already exists; skipping.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              target_commitish: sha,
              name: tagName,
              body: `GitFlow ${branchType} prerelease from ${branchName} at ${sha}`,
              prerelease: true,
              draft: false,
              make_latest: false,
            });

  # ---------------------------------------------------------------------------
  # Deploy to prod — triggered when a final release is published
  # ---------------------------------------------------------------------------
  deploy-prod:
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false) ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
      )
    name: Deploy → prod
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx (for ARM64 support)
        uses: docker/setup-buildx-action@v3

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node.js dependencies
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to prod
        run: make deploy-prod REGION=${{ env.AWS_REGION }}
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ env.DD_SITE }}
          APP_VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
